<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fluid Log</title>
  <meta name="description" content="Track what you drink and your urine output, see progress against a daily target, and export your history. Your data stays on your device.">
  <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fluid Log">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="main" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#/day" data-tab="day">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>
      <span>Today</span>
    </a>
    <a href="#/history" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>History</span>
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <!-- Add / edit entry sheet -->
  <dialog id="entry-dialog" aria-labelledby="entry-title">
    <form id="entry-form" method="dialog">
      <header class="sheet-head">
        <h2 id="entry-title">Add drink</h2>
        <button type="button" class="link-btn" data-close>Cancel</button>
      </header>

      <div class="segmented" role="radiogroup" aria-label="Intake or output">
        <label><input type="radio" name="kind" value="in" checked><span>Intake</span></label>
        <label><input type="radio" name="kind" value="out"><span>Output (urine)</span></label>
      </div>

      <fieldset id="type-field">
        <legend>Drink</legend>
        <div id="type-chips" class="chips"></div>
      </fieldset>

      <fieldset>
        <legend>Volume</legend>
        <div id="vol-chips" class="chips"></div>
        <label class="vol-input">
          <span class="sr-only">Volume</span>
          <input id="vol" name="vol" type="number" inputmode="decimal" min="1" step="any" required>
          <span id="vol-unit">ml</span>
        </label>
      </fieldset>

      <label class="field">
        <span>Time</span>
        <input id="when" name="when" type="datetime-local" required>
      </label>

      <label class="field">
        <span>Note <small>(optional)</small></span>
        <input id="note" name="note" type="text" maxlength="200" autocomplete="off" placeholder="e.g. with lunch">
      </label>

      <div class="sheet-actions">
        <button type="submit" class="btn btn-primary btn-block">Save</button>
        <button type="button" id="delete-entry" class="btn btn-danger btn-block" hidden>Delete entry</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
