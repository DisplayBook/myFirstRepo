name: Scrape Tesla Model Y Prices

on:
  schedule:
    - cron: '0 8 * * *'  # 8am UTC daily
  workflow_dispatch:       # Allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit updated prices
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "chore: update Tesla Model Y prices $(date -u +%Y-%m-%d)"
          git push
